<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💕 Cek Jodoh</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

h1 {
    margin-bottom: 5px;
    color: #ff477e;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: left;
    margin: 15px 0 7px;
    font-weight: bold;
    color: #444;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #eee;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff477e;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    background: #ff477e;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e9366b;
}

#hasil {
    display: none;
    margin-top: 25px;
    padding: 22px;
    background: #fff0f4;
    border-radius: 20px;
}

.nama {
    font-size: 19px;
    font-weight: bold;
    color: #444;
}

.persen {
    margin: 15px 0;
    font-size: 60px;
    font-weight: bold;
    color: #ff477e;
}

.progress {
    width: 100%;
    height: 14px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #ff477e;
    transition: width 1s ease;
}

.pesan {
    margin-top: 15px;
    color: #555;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <h1>💕 Cek Jodoh</h1>

    <p class="subtitle">
        Masukkan nama kalian
    </p>

    <label for="cewe">
        Nama Cewek
    </label>

    <input
        type="text"
        id="cewe"
        placeholder="Masukkan nama cewek"
        autocomplete="off"
    >

    <label for="cowo">
        Nama Cowok
    </label>

    <input
        type="text"
        id="cowo"
        placeholder="Masukkan nama cowok"
        autocomplete="off"
    >

    <button onclick="cekJodoh()">
        💖 CEK JODOH
    </button>

    <div id="hasil">

        <div
            class="nama"
            id="namaPasangan">
        </div>

        <div
            class="persen"
            id="persen">
            0%
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

        <div
            class="pesan"
            id="pesan">
        </div>

    </div>

</div>


<script>

/*
====================================================
              SISTEM CEK JODOH
====================================================

FITUR:

✓ Persentase 0–100%
✓ Tidak menggunakan Math.random()
✓ Pasangan yang sama = hasil tetap
✓ Tidak berubah ketika tombol ditekan lagi
✓ Tidak ada database gender
✓ Nama bebas dimasukkan
====================================================
*/


/*
----------------------------------------------------
 NORMALISASI NAMA
----------------------------------------------------
*/

function normalisasi(nama) {

    return nama
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");

}


/*
----------------------------------------------------
 MEMBUAT IDENTITAS PASANGAN
----------------------------------------------------

Contoh:

aisyah + fikri

menjadi:

aisyah|fikri

Identitas ini selalu sama untuk pasangan
yang sama.
----------------------------------------------------
*/

function buatKunci(cewe, cowo) {

    return (
        normalisasi(cewe) +
        "|" +
        normalisasi(cowo)
    );

}


/*
----------------------------------------------------
 MEMBUAT PERSENTASE
----------------------------------------------------

Tidak menggunakan random.

Jadi:

Aisyah + Fikri
akan selalu mendapat angka yang sama.
----------------------------------------------------
*/

function buatPersen(cewe, cowo) {

    const kunci =
        buatKunci(cewe, cowo);

    let hash = 2166136261;

    for (let i = 0; i < kunci.length; i++) {

        hash ^= kunci.charCodeAt(i);

        hash +=
            (hash << 1) +
            (hash << 4) +
            (hash << 7) +
            (hash << 8) +
            (hash << 24);

    }

    /*
    Pastikan selalu berada di 0–100.
    */

    return Math.abs(hash >>> 0) % 101;

}


/*
----------------------------------------------------
 PESAN BERDASARKAN PERSENTASE
----------------------------------------------------
*/

function buatPesan(nilai) {

    if (nilai >= 90) {

        return "💖 Jodoh banget! Kecocokan kalian sangat tinggi!";

    }

    if (nilai >= 80) {

        return "💕 Wah, kalian sangat cocok!";

    }

    if (nilai >= 70) {

        return "🥰 Cocok nih! Chemistry-nya bagus.";

    }

    if (nilai >= 60) {

        return "😊 Lumayan cocok!";

    }

    if (nilai >= 40) {

        return "😆 Masih ada kemungkinan!";

    }

    if (nilai >= 20) {

        return "😂 Kayaknya perlu lebih banyak ngobrol.";

    }

    return "🤣 Waduh, kecocokannya rendah banget!";

}


/*
----------------------------------------------------
 CEK JODOH
----------------------------------------------------
*/

function cekJodoh() {

    const cewe =
        document
        .getElementById("cewe")
        .value
        .trim();

    const cowo =
        document
        .getElementById("cowo")
        .value
        .trim();


    /*
    CEK INPUT KOSONG
    */

    if (cewe === "" || cowo === "") {

        alert(
            "Nama cewek dan cowok harus diisi!"
        );

        return;

    }


    /*
    BUAT PERSENTASE TETAP
    */

    const nilai =
        buatPersen(cewe, cowo);


    /*
    TAMPILKAN NAMA
    */

    document
        .getElementById("namaPasangan")
        .textContent =
        cewe.toUpperCase() +
        " ❤️ " +
        cowo.toUpperCase();


    /*
    TAMPILKAN PERSEN
    */

    document
        .getElementById("persen")
        .textContent =
        nilai + "%";


    /*
    PROGRESS BAR
    */

    document
        .getElementById("progressBar")
        .style.width =
        nilai + "%";


    /*
    PESAN
    */

    document
        .getElementById("pesan")
        .textContent =
        buatPesan(nilai);


    /*
    TAMPILKAN HASIL
    */

    document
        .getElementById("hasil")
        .style.display =
        "block";

}

</script>

</body>
</html>
